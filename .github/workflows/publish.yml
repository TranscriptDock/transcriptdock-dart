name: Publish to pub.dev
# pub.dev accepts automated publishing only from a tag push. The tag must
# match the version in pubspec.yaml, for example v0.1.0.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      environment: pub.dev
      sdk: 3.14.1
      use-flutter: false
